name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # re-run by hand from the Actions tab
  repository_dispatch:
    types: [pcb-push] # sent by the PCB repo on every push, so new commits show within a minute
  schedule:
    - cron: "17 */2 * * *" # fallback refresh of the index every 2 hours

permissions:
  contents: write # the previews branch (board pictures) is pushed to
  pages: write
  id-token: write

# A running deploy finishes and the next waits: cancelling one mid-way threw away the board pictures it
# had drawn (they are stored at its end), and the next started them all over.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci # also applies patches/ (patch-package)
      - run: npm run build # typecheck + vite build -> dist/
      # The GitHub index the site reads instead of calling the API from browsers: every commit,
      # branch and file list of the repo, from a clone without file contents (no API requests).
      # Keep in step with src/github/config.ts.
      - run: node tools/build-index.mjs dist/index shivam6279/PCB=https://github.com/shivam6279/PCB.git
      # Board pictures for the home screen, kept on the previews branch (one per project and commit):
      # the ones missing are drawn with the site's own 3D code, then all are published with the site.
      - name: Check out the stored board pictures
        run: |
          if git fetch --depth 1 origin previews; then git worktree add -B previews .previews FETCH_HEAD
          else git worktree add --orphan -b previews .previews; fi
      - run: npx playwright install --with-deps chromium
      - run: node tools/render-previews.mjs dist .previews
      - name: Store new board pictures
        working-directory: .previews
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Board pictures"
          git push origin previews
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
